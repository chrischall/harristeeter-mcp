version: 1
name: Harris Teeter
slug: harristeeter
# BROWSER-BRIDGE MCP: every request reaches harristeeter.com through the
# user's signed-in tab via the fetchproxy bridge, so a registration also needs
# runtime fly-shared, bridge: true and bridgePortEnv HARRISTEETER_WS_PORT —
# registration fields this manifest has no schema for. state.dataDir below is
# required for bridge and is why it is declared.
summary: >-
  Harris Teeter for Claude via your signed-in browser tab — groceries, cart,
  pickup times and checkout (you press Place Order), digital coupons, weekly ad,
  fuel points, receipts, recipes, shopping lists, Order Ahead and prescriptions.
env:
  - name: HARRISTEETER_WS_PORT
    required: false
    help: >-
      Override the fetchproxy WebSocket port (default 37149).
  - name: HARRISTEETER_DEBUG
    required: false
    help: >-
      Set to 1 for verbose bridge logging to stderr.
  - name: MCP_USER_TZ
    required: false
    help: >-
      IANA time zone sent with pickup-time requests (default America/New_York).
  - name: KROGER_API_CLIENT_ID
    required: false
    help: >-
      Optional Kroger developer app id (developer.kroger.com). With the secret,
      product search and prices work without the browser.
  - name: KROGER_API_CLIENT_SECRET
    secret: true
    required: false
    help: >-
      Optional Kroger developer app secret.
  - name: HARRISTEETER_LOCATION_ID
    required: false
    help: >-
      Optional 8-digit store id for bridge-free search (find one with
      ht_find_stores). A store saved with ht_set_store takes precedence.
  - name: HARRISTEETER_STATE_DIR
    required: false
    help: >-
      Where the saved and remembered store live (default ~/.harristeeter-mcp).
state:
  dataDir: true
  reason: >-
    The fetchproxy identity lives at $HOME/.fetchproxy/identity/harristeeter-mcp.json
    and the pair code derives from it. Without a persistent $HOME every cold
    start mints a fresh identity and re-prompts pairing in the browser; the
    API refuses bridge without it. $HOME/.harristeeter-mcp/store.json keeps
    the store chosen with ht_set_store and the browser's last-seen store;
    without it bridge-free search forgets the store on every cold start.
egress:
  allow:
    # The only host this process dials itself: Kroger's official API, used for
    # product search and store lookup when KROGER_API_CLIENT_ID/_SECRET are set
    # (src/api/kroger.ts). Every www.harristeeter.com request is made by the
    # user's browser tab over the bridge — Akamai resets server-side
    # connections — so it is not listed.
    - api.kroger.com
examples:
  - prompt: >-
      Add 2% milk, a dozen eggs and bananas to my Harris Teeter cart.
    note: Searches each item at the pickup store, then adds the chosen UPCs.
  - prompt: >-
      What pickup times are open tomorrow evening for my Harris Teeter order?
    note: Lists pickup windows and fees for the current cart.
  - prompt: >-
      Check out my Harris Teeter cart for the 5–6 PM pickup tomorrow.
    note: Previews, then reserves the window and creates the checkout; you place the order in the browser.
  - prompt: >-
      Clip any Harris Teeter coupons for coffee and tell me what's on sale in
      produce this week.
    note: Lists and clips e-VIC coupons, then reads the weekly ad.
  - prompt: >-
      Which of my prescriptions can I refill at Harris Teeter?
    note: Needs an active pharmacy session (sign in at harristeeter.com/rx).
